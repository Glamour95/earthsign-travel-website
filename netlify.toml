# Netlify deploy config for earthsigntravels.co.za
# Static site + serverless functions for Yoco Checkout.
# Secrets (YOCO_SECRET_KEY, YOCO_WEBHOOK_SECRET) are set in the Netlify UI,
# never in this file.

[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'Static site, no build step'"

[functions]
  node_bundler = "esbuild"

# Friendly API paths
[[redirects]]
  from = "/api/create-checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200

[[redirects]]
  from = "/api/yoco-webhook"
  to = "/.netlify/functions/yoco-webhook"
  status = 200

# Keep internal files private
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
